name: Scheduled TradingAgents V8 (best-effort free tier)

on:
  workflow_dispatch:
  schedule:
    # GitHub-hosted runners are episodic, not a persistent 24/7 worker.
    # Every 6 hours keeps free-tier usage low and avoids high-frequency API spend.
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: tradingagents-v8-scheduled-cycle
  cancel-in-progress: false

jobs:
  tradingagents-cycle:
    # Secrets are intentionally required; no key or database URL is committed.
    if: ${{ secrets.DATABASE_URL != '' && secrets.GOOGLE_API_KEY != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: production
      TRADINGAGENTS_ENABLED: "true"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      TRADINGAGENTS_OUTPUT_LANGUAGE: Indonesian
      TRADINGAGENTS_MAX_DEBATE_ROUNDS: "1"
      TRADINGAGENTS_MAX_RISK_ROUNDS: "1"
      TRADINGAGENTS_MAX_TOOL_ROUNDS: "3"
      TRADINGAGENTS_POLL_INTERVAL_SECONDS: "2"
    steps:
      - name: Checkout V8 branch
        uses: actions/checkout@v4
        with:
          ref: feature/v8-tradingagents-multi-agent
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-agent-worker.txt
      - name: Install TradingAgents worker dependencies
        run: pip install -r requirements-agent-worker.txt
      - name: Validate required configuration without printing secrets
        run: |
          python - <<'PY'
          import os
          from sqlalchemy.engine import make_url
          url = make_url(os.environ["DATABASE_URL"])
          if not url.drivername.startswith("postgresql"):
              raise SystemExit("DATABASE_URL must point to shared PostgreSQL.")
          if not os.environ.get("GOOGLE_API_KEY"):
              raise SystemExit("GOOGLE_API_KEY is missing.")
          print("Provider key present; PostgreSQL URL validated (credentials hidden).")
          PY
      - name: Initialize database and run one bounded queue cycle
        run: |
          python -m agent_worker --once
