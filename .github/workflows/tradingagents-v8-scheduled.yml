name: Scheduled TradingAgents V8 (best-effort free tier)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v8-tradingagents-multi-agent
    paths:
      - backend/agent_worker.py
      - backend/app/services/analysis/gemini_throttle.py
      - backend/app/services/analysis/tradingagents_market_context.py
      - backend/app/api/signals.py
      - backend/app/schemas/signals.py
  schedule:
    # Episodic scheduled execution, not a persistent 24/7 process.
    - cron: "17 */4 * * *"

permissions:
  contents: read

concurrency:
  group: tradingagents-v8-scheduled-cycle
  cancel-in-progress: false

jobs:
  tradingagents-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      APP_ENV: production
      TRADINGAGENTS_ENABLED: "true"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      TRADINGAGENTS_LLM_PROVIDER: google
      TRADINGAGENTS_QUICK_THINK_LLM: gemini-3.1-flash-lite
      TRADINGAGENTS_DEEP_THINK_LLM: gemini-3.1-flash-lite
      TRADINGAGENTS_OUTPUT_LANGUAGE: Indonesian
      TRADINGAGENTS_GEMINI_MIN_INTERVAL_SECONDS: "13"
      TRADINGAGENTS_GEMINI_RATE_LIMIT_RETRIES: "5"
      TRADINGAGENTS_JOB_STALE_MINUTES: "120"
      TRADINGAGENTS_RESULTS_DIR: /tmp/tradingagents/results
      TRADINGAGENTS_CACHE_DIR: /tmp/tradingagents/cache
      TRADINGAGENTS_MEMORY_LOG_PATH: /tmp/tradingagents/memory/trading_memory.md
      TRADINGAGENTS_MAX_DEBATE_ROUNDS: "1"
      TRADINGAGENTS_MAX_RISK_ROUNDS: "1"
      TRADINGAGENTS_MAX_TOOL_ROUNDS: "3"
    steps:
      - name: Check required secrets are configured
        id: config
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$GOOGLE_API_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: add DATABASE_URL and GOOGLE_API_KEY in repository Actions secrets."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Required secrets are present; values remain hidden."
          fi
      - name: Checkout V8 branch
        if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          ref: feature/v8-tradingagents-multi-agent
      - name: Set up Python
        if: steps.config.outputs.configured == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-agent-worker.txt
      - name: Install TradingAgents worker dependencies
        if: steps.config.outputs.configured == 'true'
        working-directory: backend
        run: pip install -r requirements-agent-worker.txt
      - name: Verify effective Gemini model configuration
        if: steps.config.outputs.configured == 'true'
        working-directory: backend
        run: |
          python - <<'PY'
          import os
          from tradingagents.default_config import DEFAULT_CONFIG
          expected = {
              "llm_provider": "google",
              "quick_think_llm": "gemini-3.1-flash-lite",
              "deep_think_llm": "gemini-3.1-flash-lite",
          }
          actual = {key: DEFAULT_CONFIG.get(key) for key in expected}
          if actual != expected:
              raise SystemExit(f"TradingAgents model config mismatch: {actual}")
          if not os.environ.get("GOOGLE_API_KEY"):
              raise SystemExit("GOOGLE_API_KEY is missing.")
          print("TradingAgents effective provider and both model tiers verified; API key value hidden.")
          PY
      - name: Validate provider and shared PostgreSQL configuration
        if: steps.config.outputs.configured == 'true'
        working-directory: backend
        run: |
          python - <<'PY'
          import os
          from sqlalchemy.engine import make_url
          url = make_url(os.environ["DATABASE_URL"])
          if not url.drivername.startswith("postgresql"):
              raise SystemExit("DATABASE_URL must point to shared PostgreSQL.")
          if not os.environ.get("GOOGLE_API_KEY"):
              raise SystemExit("GOOGLE_API_KEY is missing.")
          print("Provider key present; PostgreSQL URL validated (credentials hidden).")
          PY
      - name: Queue scheduled analyses for all supported symbols
        if: steps.config.outputs.configured == 'true'
        working-directory: backend
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          from sqlalchemy import select
          from app.database.base import Base
          from app.database.migrations import migrate_schema
          from app.database.session import SessionLocal, engine
          from app.models.agent_analysis_job import AgentAnalysisJob
          from app.models.signal_event import SignalEvent

          symbols = ("BTCUSDT", "ETHUSDT", "SOLUSDT", "BNBUSDT", "XRPUSDT")
          Base.metadata.create_all(bind=engine)
          migrate_schema(engine)
          db = SessionLocal()
          try:
              now = datetime.now(timezone.utc)
              for symbol in symbols:
                  active = db.scalar(
                      select(AgentAnalysisJob.id)
                      .where(
                          AgentAnalysisJob.symbol == symbol,
                          AgentAnalysisJob.status.in_(["PENDING", "RUNNING"]),
                      )
                      .limit(1)
                  )
                  latest = db.scalar(
                      select(AgentAnalysisJob)
                      .where(AgentAnalysisJob.symbol == symbol)
                      .order_by(AgentAnalysisJob.created_at.desc())
                      .limit(1)
                  )
                  recent_completed = (
                      latest is not None
                      and latest.status == "COMPLETED"
                      and latest.completed_at is not None
                      and latest.completed_at >= now - timedelta(minutes=45)
                  )
                  missing_signal = False
                  snapshot_fresh = False
                  if recent_completed and latest.result_json:
                      try:
                          latest_result = json.loads(latest.result_json)
                      except (TypeError, json.JSONDecodeError):
                          latest_result = {}
                      plan = latest_result.get("trade_plan") if isinstance(latest_result, dict) else None
                      if plan:
                          market_context = latest_result.get("market_context") or {}
                          timeframes = market_context.get("timeframes") or {}
                          candle_time = (timeframes.get("15m") or {}).get("candle_close_time")
                          side = latest_result.get("side", "")
                          if candle_time and side in {"BUY", "SELL"}:
                              dedupe_key = (
                                  f"{symbol}:1h,30m,15m,5m:{side}:{candle_time}"
                              )
                              persisted = db.scalar(
                                  select(SignalEvent.id)
                                  .where(SignalEvent.dedupe_key == dedupe_key)
                                  .limit(1)
                              )
                              missing_signal = persisted is None
                          collected_value = market_context.get("collected_at")
                          if collected_value:
                              try:
                                  collected_at = datetime.fromisoformat(
                                      str(collected_value).replace("Z", "+00:00")
                                  )
                                  if collected_at.tzinfo is None:
                                      collected_at = collected_at.replace(tzinfo=timezone.utc)
                                  age = (now - collected_at.astimezone(timezone.utc)).total_seconds() / 60
                                  snapshot_fresh = -1 <= age <= 20
                              except ValueError:
                                  snapshot_fresh = False
                  if active is not None:
                      print(f"{symbol}: existing pending/running job; worker will process or recover it.")
                  elif recent_completed and (not missing_signal or snapshot_fresh):
                      if missing_signal:
                          print(f"{symbol}: fresh completed V8 plan has no Signal Center row; worker startup will recover it.")
                      else:
                          print(f"{symbol}: recent completed result and linked signal found; avoiding duplicate AI usage.")
                  else:
                      base = symbol[:-4]
                      db.add(AgentAnalysisJob(
                          symbol=symbol,
                          ticker=f"{base}-USD",
                          status="PENDING",
                      ))
                      print(f"{symbol}: queued.")
              db.commit()
          finally:
              db.close()
          PY
      - name: Run bounded TradingAgents jobs for supported symbols
        if: steps.config.outputs.configured == 'true'
        working-directory: backend
        run: |
          set -euo pipefail
          for cycle in 1 2 3 4 5; do
            echo "===== TradingAgents job cycle $cycle/5 ====="
            python -m agent_worker --once
          done
      - name: Verify all supported AI results were completed and persisted
        if: steps.config.outputs.configured == 'true'
        working-directory: backend
        run: |
          python - <<'PY'
          import json
          from sqlalchemy import select
          from app.database.session import SessionLocal
          from app.models.agent_analysis_job import AgentAnalysisJob
          from app.models.signal_event import SignalEvent, SignalNotification

          symbols = ("BTCUSDT", "ETHUSDT", "SOLUSDT", "BNBUSDT", "XRPUSDT")
          db = SessionLocal()
          try:
              for symbol in symbols:
                  job = db.scalar(
                      select(AgentAnalysisJob)
                      .where(AgentAnalysisJob.symbol == symbol)
                      .order_by(AgentAnalysisJob.created_at.desc())
                      .limit(1)
                  )
                  if job is None:
                      raise SystemExit(f"No {symbol} analysis job was found.")
                  if job.status != "COMPLETED" or not job.result_json:
                      raise SystemExit(
                          f"{symbol} TradingAgents did not complete: status={job.status}; "
                          f"error={job.error_message or 'no error detail'}"
                      )
                  result = json.loads(job.result_json)
                  reports = result.get("reports") if isinstance(result, dict) else None
                  if not isinstance(result, dict) or not result.get("side"):
                      raise SystemExit(f"{symbol} has no persisted AI decision payload.")
                  if not isinstance(reports, dict) or not reports:
                      raise SystemExit(f"{symbol} has no persisted multi-agent reports.")
                  plan = result.get("trade_plan")
                  if plan:
                      context = result.get("market_context") or {}
                      candle_time = (
                          (context.get("timeframes") or {}).get("15m", {})
                      ).get("candle_close_time")
                      side = result.get("side", "")
                      if not candle_time or side not in {"BUY", "SELL"}:
                          raise SystemExit(f"{symbol} has a trade plan without a valid signal candle.")
                      dedupe_key = f"{symbol}:1h,30m,15m,5m:{side}:{candle_time}"
                      signal = db.scalar(
                          select(SignalEvent)
                          .where(SignalEvent.dedupe_key == dedupe_key)
                          .limit(1)
                      )
                      if signal is None:
                          # An already-active V8 thesis is the symbol-wide
                          # duplicate guard and is a valid linked signal.
                          signal = db.scalar(
                              select(SignalEvent)
                              .where(
                                  SignalEvent.symbol == symbol,
                                  SignalEvent.status == "ACTIVE",
                                  SignalEvent.reasons_json.contains(
                                      '"strategy_mode": "TRADINGAGENTS_MULTI_AGENT_V8"',
                                      autoescape=True,
                                  ),
                              )
                              .limit(1)
                          )
                      if signal is None:
                          raise SystemExit(
                              f"{symbol} has a valid AI trade plan but no linked Signal Center event."
                          )
                      notification = db.scalar(
                          select(SignalNotification.id)
                          .where(SignalNotification.signal_id == signal.id)
                          .limit(1)
                      )
                      if notification is None:
                          raise SystemExit(
                              f"{symbol} signal {signal.id} has no linked Signal Inbox notification."
                          )
                      print(
                          f"Verified {symbol}: signal_id={signal.id}, "
                          f"status={signal.status}, side={signal.side}."
                      )
                  print(
                      f"Verified {symbol}: status={job.status}, "
                      f"decision={result.get('side')}, reports={len(reports)}."
                  )
          finally:
              db.close()
          PY
