name: Backend CI

on:
  push:
    branches: [main, "phase1/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check app tests worker.py
      - run: pytest -q
      - name: Build persistent worker container
        run: docker build -f Dockerfile.worker -t crypto-ai-worker:ci .
        working-directory: backend
