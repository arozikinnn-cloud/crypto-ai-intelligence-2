name: Mobile CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
    paths:
      - "frontend/crypto_ai_app/**"
      - "backend/app/services/analysis/intelligence.py"
      - "backend/app/api/**"
      - "backend/app/services/market_data/bitget.py"
      - "backend/app/services/analysis/tradingagents_*.py"
      - "backend/agent_worker.py"
      - ".github/workflows/tradingagents-v8-scheduled.yml"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    branches: [main, "feature/**"]
    paths:
      - "frontend/crypto_ai_app/**"
      - "backend/app/services/analysis/intelligence.py"
      - "backend/app/api/**"
      - "backend/app/services/market_data/bitget.py"
      - "backend/app/services/analysis/tradingagents_*.py"
      - "backend/agent_worker.py"
      - ".github/workflows/tradingagents-v8-scheduled.yml"
      - ".github/workflows/mobile-ci.yml"
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Backend URL reachable by the Android phone, ending in /api/v1 (optional; defaults to production)"
        required: false
        type: string

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/crypto_ai_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Generate Android platform project
        run: flutter create --platforms=android --org com.cryptoai .
      - name: Add INTERNET permission for public API and WebSocket feeds
        run: |
          python - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET" />'
          if permission not in content:
              content = content.replace("<application", "    " + permission + chr(10) + "    <application", 1)
              manifest.write_text(content)
          PY
      - name: Build Android debug APK
        env:
          API_BASE_URL: ${{ github.event.inputs.api_base_url || (((github.event_name == 'pull_request' && github.head_ref == 'feature/v8-partial-lifecycle') || (github.event_name == 'push' && github.ref_name == 'feature/v8-partial-lifecycle')) && 'https://crypto-ai-intelligence-2-backend-git-fe-706e2c-arozikinnn-cloud.vercel.app/api/v1') || (((github.event_name == 'pull_request' && github.head_ref == 'feature/v8-drawer-navigation-mainline-20261121') || (github.event_name == 'push' && github.ref_name == 'feature/v8-drawer-navigation-mainline-20261121')) && 'https://crypto-ai-intelligence-2-backend-git-fe-0e1088-arozikinnn-cloud.vercel.app/api/v1') || (((github.event_name == 'pull_request' && github.head_ref == 'feature/v8-tradingagents-multi-agent') || (github.event_name == 'push' && github.ref_name == 'feature/v8-tradingagents-multi-agent')) && 'https://crypto-ai-intelligence-2-backend-git-fe-0e1088-arozikinnn-cloud.vercel.app/api/v1') || 'https://crypto-ai-intelligence-2-backend.vercel.app/api/v1' }}
        run: |
          set +e
          for attempt in 1 2 3; do
            flutter build apk --debug --dart-define="API_BASE_URL=${API_BASE_URL}"
            result=$?
            if [ "$result" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Android build failed (attempt $attempt); waiting before retry."
              sleep $((attempt * 30))
            fi
          done
          exit "$result"
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch debug APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          disable-linux-hw-accel: false
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: |
            adb install -r "$GITHUB_WORKSPACE/frontend/crypto_ai_app/build/app/outputs/flutter-apk/app-debug.apk"
            adb logcat -c
            adb shell monkey -p com.cryptoai.crypto_ai_app 1
            sleep 15
            adb logcat -d -s AndroidRuntime:E
            echo "Debug APK installed and launch command completed on Android emulator."
            echo "Debug APK installed, remained running, and had no fatal Android runtime exception."
      - name: Build Android release APKs (split by ABI)
        env:
          API_BASE_URL: ${{ github.event.inputs.api_base_url || (((github.event_name == 'pull_request' && github.head_ref == 'feature/v8-partial-lifecycle') || (github.event_name == 'push' && github.ref_name == 'feature/v8-partial-lifecycle')) && 'https://crypto-ai-intelligence-2-backend-git-fe-706e2c-arozikinnn-cloud.vercel.app/api/v1') || (((github.event_name == 'pull_request' && github.head_ref == 'feature/v8-drawer-navigation-mainline-20261121') || (github.event_name == 'push' && github.ref_name == 'feature/v8-drawer-navigation-mainline-20261121')) && 'https://crypto-ai-intelligence-2-backend-git-fe-0e1088-arozikinnn-cloud.vercel.app/api/v1') || (((github.event_name == 'pull_request' && github.head_ref == 'feature/v8-tradingagents-multi-agent') || (github.event_name == 'push' && github.ref_name == 'feature/v8-tradingagents-multi-agent')) && 'https://crypto-ai-intelligence-2-backend-git-fe-0e1088-arozikinnn-cloud.vercel.app/api/v1') || 'https://crypto-ai-intelligence-2-backend.vercel.app/api/v1' }}
        run: |
          set +e
          for attempt in 1 2 3; do
            flutter build apk --release --split-per-abi --dart-define="API_BASE_URL=${API_BASE_URL}"
            result=$?
            if [ "$result" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Android release build failed (attempt $attempt); waiting before retry."
              sleep $((attempt * 30))
            fi
          done
          exit "$result"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: crypto-ai-intelligence-debug-apk
          path: frontend/crypto_ai_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload ABI-split release APKs
        uses: actions/upload-artifact@v4
        with:
          name: crypto-ai-intelligence-release-apks
          path: |
            frontend/crypto_ai_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            frontend/crypto_ai_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            frontend/crypto_ai_app/build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
          retention-days: 7
