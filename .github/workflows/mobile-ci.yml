name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - "frontend/crypto_ai_app/**"
      - "backend/app/services/analysis/intelligence.py"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/crypto_ai_app/**"
      - ".github/workflows/mobile-ci.yml"
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Backend URL reachable by the Android phone, ending in /api/v1 (e.g. https://your-host/api/v1)"
        required: false
        type: string

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/crypto_ai_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Generate Android platform project
        run: flutter create --platforms=android --org com.cryptoai .
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('frontend/crypto_ai_app/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Build Android debug APK
        env:
          API_BASE_URL: ${{ github.event.inputs.api_base_url || vars.API_BASE_URL || 'https://crypto-ai-intelligence-2-backend.vercel.app/api/v1' }}
        run: |
          set +e
          for attempt in 1 2 3; do
            flutter build apk --debug --dart-define="API_BASE_URL=${API_BASE_URL}"
            result=$?
            if [ "$result" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Android build failed (attempt $attempt); waiting before retry."
              sleep $((attempt * 30))
            fi
          done
          exit "$result"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: crypto-ai-intelligence-debug-apk
          path: frontend/crypto_ai_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
