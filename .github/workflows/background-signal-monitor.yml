name: Background AI Signal Monitor

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/background-signal-monitor.yml"
  schedule:
    # GitHub Actions cron uses UTC. Scan every five minutes.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: background-ai-signal-monitor
  cancel-in-progress: false

jobs:
  discover-symbols:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      symbols: ${{ steps.set-matrix.outputs.symbols }}
    steps:
      - name: Discover active signal symbols
        id: set-matrix
        env:
          SIGNALS_URL: https://crypto-ai-intelligence-2-backend.vercel.app/api/v1/signals
        run: |
          set -euo pipefail
          response="$(mktemp)"
          status="$(curl --silent --show-error --location \
            --connect-timeout 10 --max-time 45 --retry 2 --retry-all-errors --retry-delay 2 \
            --output "$response" --write-out "%{http_code}" \
            "$SIGNALS_URL?status=ACTIVE&limit=200")"
          if [ "$status" != "200" ]; then
            echo "Unable to discover active signal symbols: HTTP $status"
            cat "$response"
            exit 1
          fi
          symbols="$(python - "$response" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              active = json.load(stream)
          symbols = {"BTCUSDT", "ETHUSDT", "SOLUSDT", "BNBUSDT", "XRPUSDT"}
          for signal in active:
              symbol = signal.get("symbol")
              if isinstance(symbol, str) and symbol.isalnum() and 5 <= len(symbol) <= 20:
                  symbols.add(symbol.upper())
          print(json.dumps(sorted(symbols)))
          PY
          )"
          echo "Discovered scan symbols: $symbols"
          echo "symbols=$symbols" >> "$GITHUB_OUTPUT"
          rm -f "$response"

  scan-market:
    needs: discover-symbols
    strategy:
      fail-fast: false
      matrix:
        symbol: ${{ fromJSON(needs.discover-symbols.outputs.symbols) }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Scan ${{ matrix.symbol }} and persist any qualified signal
        env:
          API_URL: https://crypto-ai-intelligence-2-backend.vercel.app/api/v1/analysis/intelligence
        run: |
          set -euo pipefail
          response="$(mktemp)"
          status="$(curl --silent --show-error --location \
            --connect-timeout 10 --max-time 90 --retry 2 --retry-all-errors --retry-delay 2 \
            --output "$response" --write-out "%{http_code}" \
            "$API_URL?symbol=${{ matrix.symbol }}&intervals=5m%2C15m%2C1h&limit=200&order_flow_interval=5m")"
          if [ "$status" != "200" ]; then
            echo "Market scan failed with HTTP $status"
            cat "$response"
            exit 1
          fi
          python - "$response" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              data = json.load(stream)
          print("Symbol:", data.get("symbol"))
          print("Decision:", data.get("side"))
          print("Strategy:", data.get("strategy_mode"))
          print("Score:", data.get("confluence_score"), "/", data.get("max_confluence"))
          print("Timestamp:", data.get("timestamp"))
          plan = data.get("trade_plan") or {}
          if plan:
              print("Entry:", plan.get("entry"))
              print("Stop loss:", plan.get("stop_loss"))
              print("Take profit:", plan.get("take_profit"))
          print("Qualified signals and notifications are persisted by the API.")
          PY
          rm -f "$response"
