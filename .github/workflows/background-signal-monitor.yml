name: Background AI Signal Monitor

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/background-signal-monitor.yml"
  schedule:
    # Run hourly, then keep scanning every 5 minutes inside the job.
    # This avoids relying on GitHub's heavily delayed */5 cron queue.
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: background-ai-signal-monitor
  cancel-in-progress: false

jobs:
  scan-market:
    runs-on: ubuntu-latest
    timeout-minutes: 59
    steps:
      - name: Poll market and monitor signal lifecycle for 11 cycles
        env:
          API_URL: https://crypto-ai-intelligence-2-backend.vercel.app/api/v1/analysis/intelligence
          SIGNALS_URL: https://crypto-ai-intelligence-2-backend.vercel.app/api/v1/signals
        shell: bash
        run: |
          set -euo pipefail
          for cycle in $(seq 1 11); do
            echo "===== Background market scan cycle $cycle/11 ====="
            active_response="$(mktemp)"
            active_status="$(curl --silent --show-error --location \
              --connect-timeout 10 --max-time 45 --retry 2 --retry-all-errors --retry-delay 2 \
              --output "$active_response" --write-out "%{http_code}" \
              "$SIGNALS_URL?status=ACTIVE&limit=200")"
            if [ "$active_status" != "200" ]; then
              echo "Unable to discover active signal symbols: HTTP $active_status"
              cat "$active_response"
              rm -f "$active_response"
              exit 1
            fi

            symbols="$(python - "$active_response" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              active = json.load(stream)
          symbols = {"BTCUSDT", "ETHUSDT", "SOLUSDT", "BNBUSDT", "XRPUSDT"}
          for signal in active:
              symbol = signal.get("symbol")
              if isinstance(symbol, str) and symbol.isalnum() and 5 <= len(symbol) <= 20:
                  symbols.add(symbol.upper())
          print("\n".join(sorted(symbols)))
          PY
          )"
            rm -f "$active_response"
            echo "Symbols to scan:"
            printf '%s\n' "$symbols"

            pids=()
            while IFS= read -r symbol; do
              [ -n "$symbol" ] || continue
              (
                response="$(mktemp)"
                status="$(curl --silent --show-error --location \
                  --connect-timeout 10 --max-time 90 --retry 2 --retry-all-errors --retry-delay 2 \
                  --output "$response" --write-out "%{http_code}" \
                  "$API_URL?symbol=$symbol&intervals=1h%2C15m%2C5m&limit=200&order_flow_interval=5m")"
                if [ "$status" != "200" ]; then
                  echo "Market scan failed for $symbol with HTTP $status"
                  cat "$response"
                  rm -f "$response"
                  exit 1
                fi
                python - "$response" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              data = json.load(stream)
          print(
              data.get("symbol"),
              "decision=", data.get("side"),
              "score=", f'{data.get("confluence_score")}/{data.get("max_confluence")}',
              "strategy=", data.get("strategy_mode"),
          )
          plan = data.get("trade_plan") or {}
          if plan:
              print("  entry=", plan.get("entry"), "SL=", plan.get("stop_loss"), "TP=", plan.get("take_profit"))
          PY
                rm -f "$response"
              ) &
              pids+=("$!")
            done <<< "$symbols"

            failed=0
            for pid in "${pids[@]}"; do
              wait "$pid" || failed=1
            done
            if [ "$failed" -ne 0 ]; then
              echo "At least one symbol scan failed in cycle $cycle."
              exit 1
            fi
            echo "Cycle $cycle completed; existing active signals were checked by the API."

            if [ "$cycle" -lt 11 ]; then
              sleep 300
            fi
          done
          echo "All 11 background scan cycles completed."
