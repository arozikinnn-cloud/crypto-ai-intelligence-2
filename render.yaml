services:
  - type: web
    name: crypto-ai-intelligence-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: CVD_COLLECTOR_ENABLED
        value: "true"
      - key: LIQUIDATION_COLLECTOR_ENABLED
        value: "true"
