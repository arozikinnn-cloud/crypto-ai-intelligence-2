[project]
name = "crypto-ai-intelligence-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic-settings>=2.5,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "httpx>=0.27,<1.0",
    "websockets>=12.0,<16.0",
    "firebase-admin>=6.5,<8.0",
]

[tool.vercel]
# Load the existing Vercel adapter; it adds backend/ to sys.path
# before importing the project's FastAPI app.
entrypoint = "api.index:app"
